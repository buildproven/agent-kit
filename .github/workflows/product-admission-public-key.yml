name: Product Admission Public Key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  derive-public-trust-root:
    # This job is only useful from the reviewed protected default branch. Its
    # key derivation is inline so no candidate-controlled script can receive
    # the protected signing secrets.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.workflow_ref == format('{0}/.github/workflows/product-admission-public-key.yml@refs/heads/{1}', github.repository, github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Derive public trust-root artifact
        env:
          PRODUCT_EVIDENCE_PRIVATE_KEY: ${{ secrets.PRODUCT_EVIDENCE_PRIVATE_KEY }}
          PRODUCT_ADMISSION_PRIVATE_KEY: ${{ secrets.PRODUCT_ADMISSION_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir product-admission-public-key
          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')

          function publicKey(encoded, label) {
            if (typeof encoded !== 'string' || encoded.length === 0)
              throw new Error(`${label} signing key is missing`)
            const privateDer = Buffer.from(encoded, 'base64')
            if (privateDer.toString('base64') !== encoded.trim())
              throw new Error(`${label} signing key is not canonical base64`)
            const privateKey = crypto.createPrivateKey({
              key: privateDer,
              format: 'der',
              type: 'pkcs8',
            })
            if (privateKey.asymmetricKeyType !== 'ed25519')
              throw new Error(`${label} signing key is not Ed25519`)
            const publicDer = crypto.createPublicKey(privateKey).export({
              format: 'der',
              type: 'spki',
            })
            return {
              material: publicDer.toString('base64'),
              fingerprint: crypto.createHash('sha256').update(publicDer).digest('hex'),
            }
          }
          const evidence = publicKey(
            process.env.PRODUCT_EVIDENCE_PRIVATE_KEY,
            'product evidence',
          )
          const admission = publicKey(
            process.env.PRODUCT_ADMISSION_PRIVATE_KEY,
            'product admission',
          )
          fs.writeFileSync(
            'product-admission-public-key/product-evidence-public-key',
            `${evidence.material}\n`,
            { mode: 0o600 },
          )
          fs.writeFileSync(
            'product-admission-public-key/product-admission-public-key',
            `${admission.material}\n`,
            { mode: 0o600 },
          )
          fs.writeFileSync(
            'product-admission-public-key/provenance.json',
            `${JSON.stringify({
              schemaVersion: 1,
              keys: {
                productEvidence: {
                  algorithm: 'Ed25519',
                  fingerprint: evidence.fingerprint,
                },
                productAdmission: {
                  algorithm: 'Ed25519',
                  fingerprint: admission.fingerprint,
                },
              },
              repository: process.env.GITHUB_REPOSITORY,
              repositoryId: process.env.GITHUB_REPOSITORY_ID,
              workflowCommit: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            })}\n`,
            { mode: 0o600 },
          )
          NODE
      - name: Verify public trust-root artifact
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s product-admission-public-key/product-evidence-public-key
          test -s product-admission-public-key/product-admission-public-key
          test -s product-admission-public-key/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-admission-public-key-${{ github.run_id }}
          path: product-admission-public-key
          if-no-files-found: error
          retention-days: 7
