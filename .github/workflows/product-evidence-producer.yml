name: Product Evidence Producer

on:
  workflow_run:
    workflows: ["Product Evidence Source"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  sign-product-evidence:
    # workflow_run uses this file from the protected default branch. Never
    # checkout the candidate and never expose the signing secret to it.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Download source artifact without candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name == "product-evidence-source-" + env.SOURCE_RUN) | .id')"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > source.zip
          unzip -q source.zip -d source
      - name: Sign platform-validated receipts
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_EVIDENCE_PRIVATE_KEY: ${{ secrets.PRODUCT_EVIDENCE_PRIVATE_KEY }}
          PRODUCT_EVIDENCE_WORKFLOW_PATH: .github/workflows/product-evidence-producer.yml
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > source-jobs.json
          pr="$(node -p 'require("./source/request.json").pullRequest')"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > pull-request.json
          node scripts/product-evidence-producer.js "$GITHUB_EVENT_PATH" source-run.json source-jobs.json pull-request.json source product-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-evidence-producer-${{ github.run_id }}
          path: product-evidence
          if-no-files-found: error
          retention-days: 7
