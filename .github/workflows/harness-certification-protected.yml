name: Harness Certification Protected

on:
  workflow_run:
    workflows: ["Harness Certification Source"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  certify:
    # workflow_run loads this file from protected main. It never checks out or
    # executes candidate workflow/configuration, and the candidate gets no
    # token, network, host home, or writable host mount inside Docker.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Install frozen baseline toolchain
        run: npm ci --ignore-scripts
      - name: Validate source run and fetch candidate as data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          test "$(jq -r '.name' "$RUNNER_TEMP/source-run.json")" = 'Harness Certification Source'
          test "$(jq -r '.path' "$RUNNER_TEMP/source-run.json")" = '.github/workflows/harness-certification-source.yml'
          test "$(jq -r '.event' "$RUNNER_TEMP/source-run.json")" = 'pull_request'
          test "$(jq '.pull_requests | length' "$RUNNER_TEMP/source-run.json")" = 1
          pr="$(jq -r '.pull_requests[0].number' "$RUNNER_TEMP/source-run.json")"
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,baseRefOid > "$RUNNER_TEMP/pull.json"
          test "$(jq -r '.state' "$RUNNER_TEMP/pull.json")" = OPEN
          head="$(jq -r '.headRefOid' "$RUNNER_TEMP/pull.json")"
          base="$(jq -r '.baseRefOid' "$RUNNER_TEMP/pull.json")"
          test "$head" = "$(jq -r '.head_sha' "$RUNNER_TEMP/source-run.json")"
          printf '%s\n' "$head" > "$RUNNER_TEMP/head"
          git init -q "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/candidate" fetch --depth=1 origin "$head"
          git -C "$RUNNER_TEMP/candidate" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$head"
          printf '%s\n' "$pr" > "$RUNNER_TEMP/pr"
          printf '%s\n' "$base" > "$RUNNER_TEMP/base"
      - name: Run fixed container gates
        id: certify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_CERTIFICATION_IMAGE: docker.io/library/node@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
        run: |
          node scripts/harness-certify.js \
            --baseline-sha "$(git rev-parse HEAD)" \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --candidate-head "$(cat "$RUNNER_TEMP/head")" \
            --base-sha "$(cat "$RUNNER_TEMP/base")" \
            --profile agent-kit \
            --claim engineering \
            --github-repo "$GITHUB_REPOSITORY" \
            --pr "$(cat "$RUNNER_TEMP/pr")" \
            --container-image "$HARNESS_CERTIFICATION_IMAGE" \
            --out "$RUNNER_TEMP/harness-certification-receipt.json"
      - name: Preserve certification receipt
        id: receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-certification-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/harness-certification-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish exact candidate-head certification check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFY_OUTCOME: ${{ steps.certify.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: |
          test -f "$RUNNER_TEMP/head"
          head="$(cat "$RUNNER_TEMP/head")"
          if [ "$CERTIFY_OUTCOME" = success ] && [ "$RECEIPT_OUTCOME" = success ]; then
            conclusion=success
            summary='Protected container certification passed.'
          else
            conclusion=failure
            summary='Protected container certification failed; inspect this workflow run.'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Harness Certification Protected' \
            -f head_sha="$head" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f output[title]='Protected harness certification' \
            -f output[summary]="$summary"
          test "$CERTIFY_OUTCOME" = success
          test "$RECEIPT_OUTCOME" = success
